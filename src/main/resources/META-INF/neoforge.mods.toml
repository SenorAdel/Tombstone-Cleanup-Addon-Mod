license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_ALL_VERSION"
description='''
Unofficial, community-made server-side cleanup utility for Corail Tombstone item and enchantment data. Not an official Corail Tombstone release; not affiliated with, supported, or endorsed by Corail or the Tombstone developers.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
versionRange="[${ae2_version},)"
ordering="AFTER"
side="SERVER"
